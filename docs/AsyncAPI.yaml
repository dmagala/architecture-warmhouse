asyncapi: 2.0.0
info:
  title: Telemetry Events API
  version: 1.0.0
  description: Асинхронные события телеметрии

channels:
  device.telemetry:
    publish:
      message:
        $ref: '#/components/messages/TelemetryEvent'

components:
  messages:
    TelemetryEvent:
      payload:
        type: object
        properties:
          deviceId: { type: string, format: uuid }
          value: { type: number }
          metricType: { type: string, enum: [TEMPERATURE, POWER] }
          timestamp: { type: string, format: date-time }

  schemas:
    Error:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
